[package]
name = "switchboard"
version = "0.2.1"
description = "Terminal session manager for Claude Code"
authors = ["you"]
edition = "2021"

[lib]
name = "switchboard_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["image-png"] }
tauri-plugin-shell = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-dialog = "2"
tauri-plugin-log = "2"
tauri-plugin-notification = "2"
log = "0.4"
serde = { version = "1", features = ["derive"] }
# preserve_order: registry.json project order is meaningful (the Explorer's
# left rail lists projects in file order, not alphabetized BTreeMap order).
serde_json = { version = "1", features = ["preserve_order"] }
portable-pty = "=0.8.1"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
dirs = "5"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
  "Win32_System_Power",
] }
