<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Machine</title>
<style>
  :root { color-scheme: dark; --bg: #0b0c0f; --panel: #121419; --text: #d6dae2; --dim: #7c8290; --line: #232730; --warn: #f5a524; --live: #ef5350; --hold: #5aa9ff; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 13px/1.45 ui-monospace, "Cascadia Mono", Consolas, monospace; padding: 16px; max-width: 860px; }
  header { display: flex; flex-wrap: wrap; align-items: baseline; gap: 10px 16px; margin-bottom: 14px; }
  header.stale h1 { color: var(--warn); }
  h1 { font-size: 15px; margin: 0; letter-spacing: .06em; text-transform: uppercase; }
  h2 { font-size: 11px; margin: 18px 0 6px; color: var(--dim); letter-spacing: .08em; text-transform: uppercase; }
  h2 .n { color: var(--text); }
  h2 small, summary small { font-weight: normal; text-transform: none; letter-spacing: 0; color: var(--dim); margin-left: 6px; }
  .pills { display: flex; flex-wrap: wrap; gap: 6px; }
  .pill { border: 1px solid var(--line); border-radius: 999px; padding: 1px 9px; color: var(--dim); font-size: 11.5px; }
  .pill.live { color: var(--live); border-color: var(--live); }
  .pill.hold { color: var(--hold); border-color: var(--hold); }
  header.stale .pill.age { color: var(--warn); border-color: var(--warn); }
  ul { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
  .row { display: grid; grid-template-columns: minmax(160px, 1.4fr) 2fr auto auto auto; gap: 2px 12px; align-items: baseline; padding: 6px 0; border-bottom: 1px solid var(--line); }
  .row .meta, .row .quiet { color: var(--dim); }
  .row .where { grid-column: 1 / -1; font-size: 11.5px; color: var(--dim); }
  button.stop { font: inherit; font-size: 10.5px; background: none; color: var(--dim); border: 1px solid var(--line); border-radius: 4px; padding: 0 7px; cursor: pointer; }
  button.stop[disabled] { opacity: .4; cursor: default; }
  button.stop:hover { color: var(--text); border-color: var(--text); }
  button.stop.arm { color: var(--live); border-color: var(--live); }
  button.stop.sent { color: var(--hold); border-color: var(--hold); cursor: default; }
  button.stop.failed { color: var(--warn); border-color: var(--warn); }
  .row .where .lane { color: var(--text); }
  .row .where .owner.dim { opacity: .7; }
  .row .quiet { text-align: right; white-space: nowrap; }
  .row.warn .name, .row.warn .quiet { color: var(--warn); }
  .row.dim .name { color: var(--dim); }
  .tag { font-size: 10.5px; border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; color: var(--dim); white-space: nowrap; }
  .row.warn .tag { color: var(--warn); border-color: var(--warn); }
  details { margin-top: 18px; }
  summary { cursor: pointer; font-size: 11px; color: var(--dim); letter-spacing: .08em; text-transform: uppercase; }
  summary .n { color: var(--text); }
  footer { margin-top: 20px; color: var(--dim); font-size: 11px; }
  #err { color: var(--warn); margin: 12px 0; display: none; }
  @media (max-width: 560px) { .row { grid-template-columns: 1fr auto; } .row .meta { grid-column: 1 / -1; } }
</style>
</head>
<body>
<div id="err"></div>
<main id="app">loading…</main>
<footer>refreshes every 30 s · <code>mw.sh live</code> turns the rule on, <code>mw.sh hold 3</code> pauses it, <code>mw.sh dry</code> reverts</footer>
<script src="panel.js"></script>
<script>
  (function () {
    var app = document.getElementById("app");
    var err = document.getElementById("err");
    function load() {
      var bust = "?t=" + Date.now();
      Promise.all([
        fetch("state/containers.json" + bust, { cache: "no-store" }).then(function (r) { if (!r.ok) throw new Error("containers.json " + r.status); return r.json(); }),
        fetch("state/actions.jsonl" + bust, { cache: "no-store" }).then(function (r) { return r.ok ? r.text() : ""; }),
        // Switchboard's thread records (title + working folder), mounted beside the state when they exist;
        // without them rows simply show no owner.
        fetch("threads.json" + bust, { cache: "no-store" }).then(function (r) { return r.ok ? r.json() : null; }).catch(function () { return null; }),
      ]).then(function (res) {
        err.style.display = "none";
        app.innerHTML = MachinePanel.render(MachinePanel.model(res[0], MachinePanel.parseActions(res[1]), Date.now(), res[2]));
        markPending();
      }).catch(function (e) {
        err.style.display = "block";
        err.textContent = "The watcher's page cannot read the snapshot (" + e.message + ") — run `bash watcher/mw.sh ensure` in the switchboard repo.";
      });
    }
    load();
    setInterval(function () { if (!document.hidden) load(); }, 30000);
    document.addEventListener("visibilitychange", function () { if (!document.hidden) load(); });

    // STOP is two clicks: the first arms the button for five seconds (a framed page
    // cannot use confirm()), the second posts the request. The watcher stops the
    // container on its next request poll, takes a snapshot right after, and logs
    // it; the page reloads to show that. A stop already sent stays "stopping…"
    // across re-renders (pending, by name) until the row is gone or 90 s pass, so
    // a row that Docker is still winding down does not grow a fresh button.
    var armed = null;
    var pending = {};
    function markPending() {
      var now = Date.now();
      Object.keys(pending).forEach(function (n) { if (now - pending[n] > 90000) delete pending[n]; });
      var stale = document.querySelector("header.stale");
      Array.prototype.forEach.call(app.querySelectorAll("button.stop"), function (b) {
        var n = b.getAttribute("data-name");
        if (pending[n]) { b.classList.add("sent"); b.textContent = "stopping…"; }
        else if (stale) { b.disabled = true; b.title = "the watcher is not writing snapshots; a request would wait for it"; }
      });
    }
    app.addEventListener("click", function (ev) {
      var b = ev.target.closest && ev.target.closest("button.stop");
      if (!b || b.disabled || b.classList.contains("sent")) return;
      var name = b.getAttribute("data-name");
      if (armed !== b) {
        if (armed) { armed.classList.remove("arm"); armed.textContent = "stop"; }
        armed = b; b.classList.add("arm"); b.textContent = "confirm stop";
        setTimeout(function () { if (armed === b) { armed = null; b.classList.remove("arm"); b.textContent = "stop"; } }, 5000);
        return;
      }
      armed = null;
      pending[name] = Date.now();
      markPending();
      fetch("cgi-bin/stop", {
        method: "POST",
        headers: { "Content-Type": "application/x-www-form-urlencoded", "X-Machine-Page": "1" },
        body: "name=" + encodeURIComponent(name),
      })
        .then(function (r) {
          return r.text().then(function (t) {
            var j = null;
            try { j = JSON.parse(t); } catch (e) { /* httpd's own error page */ }
            if (!r.ok) throw new Error((j && j.error) || "HTTP " + r.status);
          });
        })
        .then(function () { setTimeout(load, 7000); })
        .catch(function (e) {
          delete pending[name];
          b.classList.remove("sent"); b.classList.add("failed"); b.textContent = "failed: " + e.message;
        });
    });
  })();
</script>
</body>
</html>
